  <circle cx="24" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="6" fill="#febc2e"/>
  <circle cx="68" cy="21" r="6" fill="#28c840"/>
  <text x="540" y="26" text-anchor="middle" fill="#8b949e" font-size="12">n2k command center</text>

  <text x="34" y="76" fill="#20c997" font-size="22" font-weight="700">n2k</text>
  <text x="82" y="76" fill="#7c8799" font-size="14">NMEA 2000 developer console</text>
  <text x="54" y="119" fill="#f0f6fc" font-size="15" font-weight="700">N2K COMMAND CENTER</text>
  <text x="54" y="144" fill="#7c8799" font-size="12">7 workflows</text>

  <rect x="34" y="163" width="1012" height="56" rx="6" fill="#152e2b"/>
