name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          check-latest: true

      - name: Test
        run: go test ./...

  race:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          check-latest: true

      - name: Race detector
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0

  secure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          check-latest: true

      - name: Run govulncheck
        env:
          GOTOOLCHAIN: go1.25.12
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

      - name: Run gosec
        env:
          GOTOOLCHAIN: go1.25.12
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          gosec -exclude-dir=.claude -exclude=G115 ./...

  release-gate:
    if: ${{ always() }}
    needs: [test, race, lint, secure]
    runs-on: ubuntu-latest
    env:
      TEST_RESULT: ${{ needs.test.result }}
      RACE_RESULT: ${{ needs.race.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      SECURE_RESULT: ${{ needs.secure.result }}

    steps:
      - name: Require every release gate
        run: |
          test "$TEST_RESULT" = success
          test "$RACE_RESULT" = success
          test "$LINT_RESULT" = success
          test "$SECURE_RESULT" = success
