name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      runner: ${{ matrix.os }}
      command: |
        go test ./...
        install_dir="$RUNNER_TEMP/n2k-install"
        N2K_INSTALL_DIR="$install_dir" sh ./install.sh
        binary=n2k
        if [ "$RUNNER_OS" = Windows ]; then
          binary=n2k.exe
        fi
        "$install_dir/$binary" version
        uninstall_dir="$RUNNER_TEMP/n2k-uninstall"
        mkdir -p "$uninstall_dir"
        binary=n2k
        if [ "$RUNNER_OS" = Windows ]; then
          binary=n2k.exe
        fi
        go build -trimpath -o "$uninstall_dir/$binary" ./cmd/n2k
        HOME="$RUNNER_TEMP/n2k-uninstall-home" "$uninstall_dir/$binary" uninstall
        for attempt in $(seq 1 100); do
          if [ ! -e "$uninstall_dir/$binary" ]; then
            exit 0
          fi
          sleep 0.1
        done
        echo "n2k uninstall did not remove $uninstall_dir/$binary" >&2
        exit 1

  race:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      command: |
        go test -race ./...

  lint:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      lint: true

  secure:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      security: true
      gosec-excludes: G115
      gosec-exclude-generated: false

  release-gate:
    if: ${{ always() }}
    needs: [test, race, lint, secure]
    uses: open-ships/ci/.github/workflows/gate.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      results: ${{ toJSON(needs) }}
